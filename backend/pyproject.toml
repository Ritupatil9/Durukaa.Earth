[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is intentional

[tool.ruff.lint.per-file-ignores]
# env.py must call sys.path.insert() before importing the app package, so
# its import block cannot be sorted the normal way.
"alembic/env.py" = ["I001"]

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = "/(\\.venv|alembic/versions)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
