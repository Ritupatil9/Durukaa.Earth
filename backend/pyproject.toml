[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # TODO: add your actual dependencies here, e.g.
    # "fastapi>=0.110",
    # "uvicorn[standard]>=0.29",
    # "sqlalchemy>=2.0",
    # "alembic>=1.13",
    # "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is intentional

[tool.ruff.lint.per-file-ignores]
# env.py must call sys.path.insert() before importing the app package, so
# its import block cannot be sorted the normal way.
"alembic/env.py" = ["I001"]

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = "/(\\.venv|alembic/versions)/"

[tool.pytest.ini_options]
testpaths = ["tests"]